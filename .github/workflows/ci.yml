name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict GITHUB_TOKEN to the minimum needed for this job. The smoke
# suite doesn't upload artifacts, comment on PRs, or write to the repo,
# so contents: read is sufficient.
permissions:
  contents: read

jobs:
  test:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # SHA-pinned per zizmor's unpinned-uses rule. Bump on intentional upgrades.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        # The smoke suite (tests/test_smoke.py) exercises the FastAPI app
        # in-process via TestClient - no live server or taxa.db needed,
        # so the suite runs in seconds on a fresh checkout.
        run: pytest tests/ -v
