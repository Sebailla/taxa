name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Restrict GITHUB_TOKEN to the minimum needed for this job. The smoke
# suite doesn't upload artifacts, comment on PRs, or write to the repo,
# so contents: read is sufficient.
permissions:
  contents: read

jobs:
  test:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # SHA-pinned per zizmor's unpinned-uses rule. Bump intentionally.
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Run pytest
        # The smoke suite (tests/test_smoke.py) exercises the FastAPI app
        # in-process via TestClient - no live server or taxa.db needed,
        # so the suite runs in seconds on a fresh checkout.
        run: pytest tests/ -v
