```yaml                                                                                               
   name: Bug report
   description: Report a reproducible defect.
   title: "bug: "
   labels:
     - bug
     - type:bug
   body:
     - type: textarea
       id: summary
       attributes:
         label: Summary
         description: Describe the defect and its impact.
       validations:
         required: true

     - type: textarea
       id: reproduction
       attributes:
         label: Reproduction steps
         description: Provide minimal, deterministic steps.
         placeholder: |
           1. ...
           2. ...
           3. ...
       validations:
         required: true

     - type: textarea
       id: expected
       attributes:
         label: Expected behavior
       validations:
         required: true

     - type: textarea
       id: actual
       attributes:
         label: Actual behavior
       validations:
         required: true

     - type: textarea
       id: acceptance
       attributes:
         label: Acceptance criteria
         description: List observable outcomes that close the defect.
       validations:
         required: true

     - type: textarea
       id: validation
       attributes:
         label: Validation plan
         description: Name the focused and full checks.
       validations:
         required: true
 ```  
